<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Suppress benign Vite HMR websocket reconnection errors in container dev environment
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = typeof reason === 'string' ? reason : (reason && reason.message) ? reason.message : '';
        if (msg && (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('vite'))) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = event.message || '';
        if (msg && (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('vite'))) {
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RL Food" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/512/shopping-bag--v1.png" />
    <title>RL Food Purchase Tracking System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
